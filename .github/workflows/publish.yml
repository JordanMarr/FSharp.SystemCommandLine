# Publishes FSharp.SystemCommandLine to nuget.org using Trusted Publishing (OIDC).
# No stored API key: NuGet/login exchanges a GitHub-issued OIDC token for a
# short-lived (1 hour) API key, validated against the trusted publishing policy
# configured on nuget.org for this repository + workflow file.
#
# Trigger manually from the Actions tab (Run workflow) after bumping <Version>
# in the fsproj. The version in the fsproj determines the published version.

name: Publish to NuGet

on:
  workflow_dispatch:
  # push is unsuccessful if attempts to push same package anyway
  push: 
    branches: main
  # The pack/push stage is only run ON the main branch. Otherwise it will finish at
  # test.
  pull_request:
  # never run on a pull request that changes the build script or the CI - security concern
    paths-ignore: 
      - '**/*/build.fsx'
      - '**/*/publish.yml'
    branches: 
      - main

jobs:
  publish:
    runs-on: windows-2022

    permissions:
      id-token: write # required for GitHub OIDC token issuance (Trusted Publishing)
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: "jordan marr" # nuget.org profile name (not email)

      - name: Push
        run: dotnet fsi src\build.fsx -- publish --nuget-key ${{ steps.login.outputs.NUGET_API_KEY }}
